[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[project]
name = "devstart-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai-agents==0.6.1", "httpx==0.28.1", "openai==2.8.1"]
[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]
[project.scripts]
devstart-agent = "devstart_agent.cli:main"
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: opt-in real model test"]
